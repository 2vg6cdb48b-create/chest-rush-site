<style>
/* VOICE: a van tool: blunt, fast, glove-friendly.
   IDEA: the boiler data badge: dark plate, stamped GC numbers, one flame-orange tag.
   PICTURE: the search box and its pop-up results are the picture.
   COLOUR and TYPE: slate #121417 plate, warm paper ground, flame #FF5A1F accent; Space Grotesk numbers, Inter text.
   LAYOUT: one column up to 720px, dark header with search, content cards below, tab bar at the foot. */
:root{color-scheme:light dark;--bg:light-dark(#F3F4F1,#0E1013);--card:light-dark(#FFFFFF,#1A1D22);--ink:light-dark(#121417,#EEF0EC);--sub:light-dark(#555A52,#A9AEA6);--line:light-dark(#DADDD6,#2C3037);--plate:#121417;--plate2:#1E2126;--on:#F3F4F1;--flame:#FF5A1F;--flameText:light-dark(#A33A10,#FF8A5C);--tint:light-dark(#FFE6DC,#3A2217);--hit:light-dark(#FFD9C7,#5A2C16)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;line-height:1.1}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--flame);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header{background:var(--plate);color:var(--on);padding:max(18px,calc(env(safe-area-inset-top) + 8px)) max(4vw,16px) 18px;position:relative;z-index:5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font:700 20px 'Space Grotesk',sans-serif;text-decoration:none;color:var(--on)}
.mark{width:36px;height:36px;border-radius:10px;background:var(--flame);display:grid;place-items:center}
.status{font-size:13px;color:#A9AEA6}
.lbl{font-size:13px;color:#A9AEA6;display:block;margin-bottom:6px}
.sbox{display:flex;align-items:center;gap:10px;background:#fff;color:#121417;border-radius:14px;padding:0 8px 0 14px;height:56px}
.sbox input{border:0;outline:0;background:transparent;flex:1;font-size:17px;color:#121417;height:100%}
.sbox:focus-within{box-shadow:0 0 0 3px var(--flame)}
.clear{width:40px;height:40px;border-radius:20px;border:0;background:#E6E8E3;display:grid;place-items:center;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{height:40px;padding:0 16px;border-radius:20px;border:1px solid #3A3F39;background:transparent;color:var(--on);font-weight:500;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--flame);border-color:var(--flame);color:#121417;font-weight:600}
.pop{position:absolute;left:max(4vw,16px);right:max(4vw,16px);max-width:720px;margin:8px auto 0;background:var(--card);color:var(--ink);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.28);overflow:hidden;z-index:20}
.pophead{display:flex;justify-content:space-between;padding:12px 16px 6px;font-size:12px;font-weight:600;color:var(--sub)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;text-decoration:none;border-top:1px solid var(--line);min-height:64px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;color:inherit}
.row:first-child{border-top:0}
.row[aria-selected=true],.row:hover{background:var(--tint)}
.ava{width:40px;height:40px;flex:none;border-radius:10px;background:var(--tint);color:var(--flameText);font:700 13px 'Space Grotesk',sans-serif;display:grid;place-items:center}
.rt{font-weight:600;font-size:15px;line-height:1.3}
.rs{font-size:13px;color:var(--sub)}
mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 2px;font-weight:700}
.more{display:flex;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);background:light-dark(#F7F8F5,#15181C);font-weight:600;font-size:14px;text-decoration:none}
main{padding:20px max(4vw,16px) 110px}
.sec{margin-bottom:24px}
.sech{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.sech h2{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;padding:6px}
.tile small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.empty{padding:18px 16px;color:var(--sub);font-size:14px}
.note{font-size:13px;color:var(--sub)}
.hero{background:var(--plate);color:var(--on);padding:4px max(4vw,16px) 22px;margin:0 calc(-1*max(4vw,16px))}
.back{display:inline-flex;align-items:center;gap:6px;height:44px;color:var(--on);text-decoration:none;font-size:14px}
.hero h1{font-size:clamp(28px,7vw,40px);margin:4px 0 14px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--plate2);border-radius:12px;padding:10px 12px}
.fact span{display:block;font-size:12px;color:#A9AEA6}
.fact b{font:700 15px 'Space Grotesk',sans-serif}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--sub);font-weight:600;border-top:0}
td.gc{font:700 15px 'Space Grotesk',sans-serif;white-space:nowrap}
.doc{display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;border-top:1px solid var(--line);min-height:64px}
.doc:first-child{border-top:0}
.doc.main{background:var(--flame);color:#121417}
.pdf{width:40px;height:48px;flex:none;border-radius:6px;background:light-dark(#E6E8E3,#2C3037);color:var(--sub);font:700 11px 'Space Grotesk',sans-serif;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.doc.main .pdf{background:#121417;color:var(--flame)}
.grow{flex:1}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.pri{background:var(--flame);border-color:var(--flame);color:#121417}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.warn{color:light-dark(#A32D2D,#F09595)}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.pages{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.pg{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 6px 0 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.pg b{font-family:'Space Grotesk',sans-serif;color:var(--flameText)}
.pg button{width:32px;height:32px;border:0;border-radius:16px;background:transparent;cursor:pointer;color:var(--sub)}
.form{display:grid;gap:12px;padding:16px}
.form label{font-size:13px;font-weight:600;display:grid;gap:6px}
.form input,.form select,.form textarea{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;width:100%}
.inline{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.inline input{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px}
.msg{padding:10px 16px;font-size:14px;color:var(--flameText)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:10}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--sub);text-decoration:none;min-width:88px;padding:6px 0}
nav.tabs a[aria-current=page]{color:var(--flameText);font-weight:700}
.src{font-size:12px;color:var(--sub);padding:10px 16px;border-top:1px solid var(--line);overflow-wrap:anywhere}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:no-preference){.pop{animation:drop .14s ease-out}@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
{
const DATA = JSON.parse(document.getElementById('data').textContent);
const BR = Object.fromEntries(DATA.brands.map(b => [b.id, b]));
const $ = s => document.querySelector(s);
const view = $('#view'), q = $('#q'), pop = $('#pop'), clearBtn = $('#clear'), statusEl = $('#status'), fileIn = $('#file');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s || '').replace(/\D/g, '');
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9+]+/g, ' ').trim();
const safeUrl = u => /^https:\/\//.test(u || '') || /^\/_blob\//.test(u || '') ? u : '';
const google = s => 'https://www.google.com/search?q=' + encodeURIComponent(s);

let filter = 'all', sel = -1, results = [];
let custom = {};   // id -> custom boiler from db
let mine = {};     // id -> saved data (manuals, pages, note)
let idb = null;
const writing = {};

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

function allBoilers() {
  const list = DATA.boilers.map(b => ({ ...b, make: BR[b.b].name, ab: BR[b.b].ab, custom: false }));
  for (const [id, c] of Object.entries(custom)) {
    list.push({ id, b: '', make: c.make || 'Other', ab: (c.make || '?').slice(0, 2).toUpperCase(), r: c.range || 'Unnamed boiler', t: c.type || '', v: (c.gcs || []).map(g => [g.label || '', g.gc || '']), d: [], s: '', custom: true });
  }
  return list;
}
function byId(id) { return allBoilers().find(b => b.id === id); }

function search(raw) {
  const text = raw.trim();
  if (!text) return [];
  const qd = digits(text), qn = norm(text);
  const gcMode = filter === 'gc' || (filter === 'all' && qd.length >= 3 && qd.length >= text.replace(/[\s-]/g, '').length - 0);
  const out = [];
  for (const b of allBoilers()) {
    if (gcMode) {
      if (qd.length < 2) continue;
      const hits = b.v.filter(v => digits(v[1]).includes(qd));
      if (hits.length) out.push({ b, hits, score: hits.some(v => digits(v[1]) === qd) ? 0 : 1 });
      continue;
    }
    const make = norm(b.make), model = norm(b.r + ' ' + b.v.map(v => v[0]).join(' '));
    const hay = filter === 'make' ? make : filter === 'model' ? model : make + ' ' + model + ' ' + norm(b.t);
    const words = qn.split(' ').filter(Boolean);
    if (words.length && words.every(w => hay.includes(w))) {
      out.push({ b, hits: [], score: (norm(b.r).startsWith(words[0]) || make.startsWith(words[0])) ? 0 : 1 });
    }
  }
  out.sort((a, z) => a.score - z.score || a.b.make.localeCompare(z.b.make) || a.b.r.localeCompare(z.b.r));
  return out;
}

function hl(text, raw, gc) {
  const s = String(text);
  if (gc) {
    const qd = digits(raw); if (!qd) return esc(s);
    // highlight matching digits inside a formatted GC like 47-800-30
    const map = []; for (let i = 0; i < s.length; i++) if (/\d/.test(s[i])) map.push(i);
    const at = digits(s).indexOf(qd); if (at < 0) return esc(s);
    const st = map[at], en = map[at + qd.length - 1] + 1;
    return esc(s.slice(0, st)) + '<mark>' + esc(s.slice(st, en)) + '</mark>' + esc(s.slice(en));
  }
  const w = norm(raw).split(' ').filter(x => x.length > 1).sort((a, b) => b.length - a.length)[0];
  if (!w) return esc(s);
  const i = s.toLowerCase().indexOf(w);
  return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + w.length)) + '</mark>' + esc(s.slice(i + w.length));
}

function route() {
  const h = location.hash.slice(1) || 'home';
  document.querySelectorAll('nav.tabs a').forEach(a => a.toggleAttribute('aria-current', false));
  const tab = h.startsWith('b-') || h.startsWith('make-') ? 'home' : h;
  const cur = document.querySelector(`nav.tabs a[data-tab="${tab}"]`); if (cur) cur.setAttribute('aria-current', 'page');
  if (h.startsWith('b-')) { if (byId(h.slice(2))) remember(h.slice(2)); boilerPage(h.slice(2)); }
  else if (h.startsWith('make-')) home(h.slice(5));
  else if (h === 'saved') savedPage();
  else if (h === 'add') addPage();
  else home();
  window.scrollTo(0, 0);
}
function rerender() { const a = document.activeElement; if (a && a.id === 'note') return; const y = window.scrollY; route(); window.scrollTo(0, y); }

/* ---------- saving (on this phone, IndexedDB) ---------- */
let connecting = true;
function canSave() { return !!idb; }
function saveNote() { return connecting ? 'Opening your saved manuals…' : 'This browser won’t let the app save (private browsing?). Search still works.'; }
function fmtSize(n) { return !n ? 'PDF' : n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('manual-finder', 1);
    r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains('items')) d.createObjectStore('items'); if (!d.objectStoreNames.contains('files')) d.createObjectStore('files'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = idb.transaction(store, mode), s = t.objectStore(store), out = fn(s);
    t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const putItem = (id, v) => tx('items', 'readwrite', s => s.put(v, id));
const delItem = id => tx('items', 'readwrite', s => s.delete(id));
const putFile = (id, blob) => tx('files', 'readwrite', s => s.put(blob, id));
const getFile = id => tx('files', 'readonly', s => s.get(id));
const delFile = id => tx('files', 'readwrite', s => s.delete(id));
function updateStatus() {
  const n = Object.values(mine).reduce((k, v) => k + (v.manuals || []).length, 0);
  statusEl.textContent = !idb ? 'Search only' : n ? n + ' manual' + (n === 1 ? '' : 's') + ' on this phone' : 'Ready';
}

async function save(id, patch) {
  if (!canSave()) return;
  const prev = writing[id] || Promise.resolve();
  const run = prev.then(async () => {
    const cur = { ...(mine[id] || {}) }; delete cur._confirm; delete cur._confirmB;
    const next = { ...cur, ...patch, updatedAt: new Date().toISOString() };
    mine[id] = next;
    if (next.custom) custom[id] = next;
    await putItem(id, next);
  });
  writing[id] = run.catch(() => {});
  return run;
}

async function uploadManual(id, file) {
  const msg = document.getElementById('upmsg');
  const say = t => { if (msg) msg.innerHTML = `<div class="msg" role="status">${esc(t)}</div>`; };
  if (!file) return;
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) { say('That isn’t a PDF. Pick the manual you downloaded.'); return; }
  say('Saving “' + file.name + '”…');
  try {
    const fid = 'f-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    await putFile(fid, new Blob([file], { type: 'application/pdf' }));
    const list = [...((mine[id] || {}).manuals || [])];
    list.push({ id: fid, name: file.name.replace(/\.pdf$/i, ''), size: file.size, at: new Date().toISOString() });
    await save(id, { manuals: list });
    updateStatus(); rerender();
  } catch (e) { say('Couldn’t save the manual' + (e && e.name === 'QuotaExceededError' ? ': your phone’s storage for the app is full. Remove some old manuals first.' : '. Try again.')); }
}
async function manualFile(id, i) {
  const x = (mine[id]?.manuals || [])[i]; if (!x) return null;
  const blob = await getFile(x.id); if (!blob) return null;
  return { x, blob };
}

/* ---------- events ---------- */
q.addEventListener('input', () => { sel = -1; renderPop(); });
q.addEventListener('focus', () => { if (q.value.trim()) renderPop(); });
q.addEventListener('keydown', e => {
  const n = Math.min(results.length, 8);

  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); sel = (sel - 1 + n) % n; renderPop(); }

clearBtn.addEventListener('click', () => { q.value = ''; closePop(); clearBtn.hidden = true; q.focus(); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {

view.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const id = (location.hash.match(/^#b-(.+)$/) || [])[1];
  if (t.dataset.make) { location.hash = 'make-' + t.dataset.make; return; }
  if (t.id === 'addman') { fileIn.value = ''; fileIn.click(); return; }
  if (t.dataset.openman !== undefined && id) {
    const f = await manualFile(id, +t.dataset.openman);
    if (!f) { const mm = document.getElementById('upmsg'); if (mm) mm.innerHTML = '<div class="msg">That file is missing from this phone. Add it again.</div>'; return; }
    const url = URL.createObjectURL(f.blob);
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); return;
  }
  if (t.dataset.shareman !== undefined && id) {
    const f = await manualFile(id, +t.dataset.shareman); if (!f) return;
    const file = new File([f.blob], (f.x.name || 'manual') + '.pdf', { type: 'application/pdf' });
    try { if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: f.x.name }); } catch (err) {}
    return;
  }
  if (t.dataset.delman !== undefined && id) {
    const i = +t.dataset.delman, m = mine[id];
    if (m._confirm !== i) { m._confirm = i; rerender(); return; }
    const gone = m.manuals[i], list = m.manuals.filter((_, j) => j !== i);

    updateStatus(); rerender(); return;
  }
  if (t.dataset.delpg !== undefined && id) {
    const list = (mine[id].pages || []).filter((_, j) => j !== +t.dataset.delpg);
    try { await save(id, { pages: list }); } catch (err) {} rerender(); return;
  }
  if (t.id === 'delboiler' && id) {
    const m = mine[id] || (mine[id] = {});
    if (!m._confirmB) { m._confirmB = true; rerender(); return; }
    try { for (const x of m.manuals || []) if (x.id) await delFile(x.id); await delItem(id); delete mine[id]; delete custom[id]; } catch (err) {}
    updateStatus();
    location.hash = 'home';
  }
});
view.addEventListener('submit', async e => {

let noteTimer;
view.addEventListener('input', e => {
  if (e.target.id !== 'note') return;

  const st = $('#notestate'); if (st) st.textContent = 'Typing…';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(async () => { try { await save(id, { note: e.target.value.slice(0, 2000) }); if (st) st.textContent = 'Saved'; } catch (err) { if (st) st.textContent = 'Not saved'; } }, 900);
});
fileIn.addEventListener('change', () => { const id = (location.hash.match(/^#b-(.+)$/) || [])[1]; if (id) uploadManual(id, fileIn.files[0]); });

route();

/* ---------- open on-phone storage ---------- */
(async () => {
  try {
    idb = await openDB();
    const keys = await tx('items', 'readonly', s => s.getAllKeys());
    const vals = await tx('items', 'readonly', s => s.getAll());
    const m = {}, c = {};
    (keys || []).forEach((k, i) => { m[k] = vals[i]; if (vals[i] && vals[i].custom) c[k] = vals[i]; });
    mine = m; custom = c;
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) { idb = null; }
  connecting = false; updateStatus(); rerender();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
